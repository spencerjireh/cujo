# Cujo: the review service, its own harness (decision 123), two MCP servers
# and the board.
#
# No ports are published here: the deploy runs behind a reverse proxy that
# terminates TLS and routes cujo.spencerjireh.com to `web` (3000) and
# cujo-ingress.spencerjireh.com to `cujo` (8080). Two hostnames, and `web`
# answers exactly one of them: the anonymous board. The operator hostname was
# deleted with its plane (decision 57), and the harness has no console at all.
# For a local run with ports on your host, see the local stack section of
# AGENTS.md. Secrets come from the deploy environment, never this file.

services:
  # The agent harness: sessions, turns, the event log and the approval gate
  # over the pi coding agent SDK (decision 123). State is one SQLite file and
  # the pi transcripts on its volume; there is no database service and no UI.
  # Hardened like `cujo`: non-root image, read-only rootfs except the volume.
  harness:
    build:
      context: .
      dockerfile: apps/harness/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8790
      HARNESS_DATA_DIR: /data
      CUJO_LOG_LEVEL: ${CUJO_LOG_LEVEL:-info}
    volumes:
      - harnessdata:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      github-mcp:
        condition: service_healthy
      sandbox-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # A turn that is mid-flight when the container stops is ended as an error
    # at the next boot and retried once by cujo (decision 130); the grace is
    # for the event log to flush, not for the turn to finish.
    stop_grace_period: 35s
    restart: unless-stopped

  # The Cujo service: webhook receiver, run store, harness event folder, and
  # the read API. Two hostnames and two planes from one process (spec
  # Contract 6): the signature-gated ingress host, and the internal name that
  # carries the anonymous `/public` group. No authenticated route at all
  # (decision 57).
  # Hardened: non-root image, read-only rootfs except the SQLite volume, no
  # extra capabilities.
  cujo:
    build:
      context: .
      dockerfile: apps/cujo/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      HARNESS_BASE_URL: http://harness:8790
      GITHUB_MCP_URL: http://github-mcp:8081/mcp
      SANDBOX_MCP_URL: http://sandbox-mcp:8082/mcp
      CUJO_DB_PATH: /data/cujo.db
      # The name `web` addresses this service by on the compose network, and
      # the only name the read plane answers on. Node's fetch always sends the
      # target's own authority as Host, so the UI's proxy could never present a
      # published hostname anyway (decision 57).
      CUJO_INTERNAL_HOST: cujo
      CUJO_WEBHOOK_HOST: ${CUJO_WEBHOOK_HOST}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      CUJO_MODEL: ${CUJO_MODEL}
      # How hard the model is asked to think: none, minimal, low, medium, high,
      # xhigh, max. Unset leaves the provider's default, which is what a model
      # that does not reason at all needs (decision 53).
      CUJO_MODEL_REASONING_EFFORT: ${CUJO_MODEL_REASONING_EFFORT:-}
      # Sampling, and both are off unless you set them. Every key here reaches
      # the provider verbatim, and some reasoning models reject `temperature`
      # outright — which fails the way decision 56 describes: healthy process,
      # 502 on every pull request. Set them once you know yours accepts them.
      CUJO_MODEL_TEMPERATURE: ${CUJO_MODEL_TEMPERATURE:-}
      CUJO_MODEL_MAX_TOKENS: ${CUJO_MODEL_MAX_TOKENS:-}
      # Optional Discord notifications (spec Contract 7). Unset means the
      # service runs without them; the repo-to-channel map lives in the store.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # The application public key, which gates the /cujo command (Contract 8).
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      # The one server a repo that declares no `discord_guild` belongs to
      # (decision 40). One id, never a list: every other server is refused
      # exactly as before. Unset keeps Contract 8's original rule.
      CUJO_DEFAULT_DISCORD_GUILD: ${CUJO_DEFAULT_DISCORD_GUILD:-}
      # The board a Discord card links to, and the only origin there is. A
      # private run has no page, so its card carries no link; empty means no
      # card carries one at all (decision 57).
      CUJO_PUBLIC_BASE_URL: ${CUJO_PUBLIC_BASE_URL:-}
      # Concurrent anonymous run streams this process will hold, and how often
      # it re-asks GitHub whether each repo with a run is still public.
      CUJO_PUBLIC_STREAM_LIMIT: ${CUJO_PUBLIC_STREAM_LIMIT:-200}
      CUJO_VISIBILITY_RECHECK_MS: ${CUJO_VISIBILITY_RECHECK_MS:-900000}
      # `@cujo-guard` (decision 47). The one path where a comment provisions a
      # sandbox, so it has a ceiling; 0 turns conversation off entirely.
      CUJO_CONVERSE_LIMIT: ${CUJO_CONVERSE_LIMIT:-3}
      CUJO_CONVERSE_WINDOW_MS: ${CUJO_CONVERSE_WINDOW_MS:-3600000}
      CUJO_CONVERSE_TIMEOUT_MS: ${CUJO_CONVERSE_TIMEOUT_MS:-600000}
      # Does Cujo react on the pull requests it reviews (decision 38)? Only an
      # explicit 0 turns it off.
      CUJO_PR_REACTIONS: ${CUJO_PR_REACTIONS:-1}
      # One turn, stream retries included. The harness has no timeout of its
      # own; this watchdog is what ends a review that hangs.
      CUJO_TURN_TIMEOUT_MS: ${CUJO_TURN_TIMEOUT_MS:-1800000}
      # The model provider, registered on the harness at start (decision 127).
      # The harness holds nothing until this process tells it; there is no
      # console to configure it in.
      MODEL_PROVIDER_NAME: ${MODEL_PROVIDER_NAME:-}
      MODEL_PROVIDER_BASE_URL: ${MODEL_PROVIDER_BASE_URL:-}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      MODEL_PROVIDER_MODELS: ${MODEL_PROVIDER_MODELS:-}
      # What the harness needs to know about those models: the window it
      # compacts against, the output cap, and whether a reasoning effort means
      # anything to them. One value each for every model in the list.
      MODEL_PROVIDER_CONTEXT_WINDOW: ${MODEL_PROVIDER_CONTEXT_WINDOW:-128000}
      MODEL_PROVIDER_MAX_TOKENS: ${MODEL_PROVIDER_MAX_TOKENS:-16384}
      MODEL_PROVIDER_REASONING: ${MODEL_PROVIDER_REASONING:-1}
    volumes:
      - cujodata:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      harness:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
      sandbox-mcp:
        condition: service_healthy
    restart: unless-stopped

  # The sandbox, behind an interface and reached over MCP (decision 113). The
  # harness provisions nothing; the agent reaches a box only through the five
  # tools this server lists.
  #
  # This is the one service here that cannot carry the hardening the others do.
  # It provisions a container, an egress gateway and a network per sandbox, so it
  # needs the Docker socket -- and `read_only`, `cap_drop: ALL` and
  # `no-new-privileges` are all incompatible with that. Decision 114 argues the
  # trade rather than hiding it, and the mitigation is that this service is small,
  # holds no pull request code, and takes no image name or host path from a caller.
  # Never routed by Traefik.
  sandbox-mcp:
    build:
      context: .
      dockerfile: apps/sandbox-mcp/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8082
      # `local` is a container on this host with egress enforced outside it;
      # `daytona` is the old vendor, kept so the move is reversible on one
      # variable. A value that is neither refuses to boot rather than defaulting,
      # because a typo that silently ran a different isolation model is the one
      # failure this service must not have.
      CUJO_SANDBOX_RUNTIME: ${CUJO_SANDBOX_RUNTIME:-local}
      # Built from sandbox/Dockerfile (decision 117). It ships `sniff.py` and
      # `cujo_sniff/` at /opt/cujo plus a Python and a Node toolchain, so there
      # is no runtime fetch and no tarball URL any more. These are tags, not
      # pulls: sandbox-mcp builds both at boot from contexts its own image
      # carries (decision 118), because they are `docker run` per sandbox and
      # not services here, so `up --build` would never build them. Until both
      # exist it answers 503, which is why the healthcheck's start period is
      # long enough for a cold build.
      CUJO_SANDBOX_IMAGE: ${CUJO_SANDBOX_IMAGE:-cujo-sandbox:latest}
      CUJO_SANDBOX_GATEWAY_IMAGE: ${CUJO_SANDBOX_GATEWAY_IMAGE:-cujo-sandbox-gateway:latest}
      # gVisor. Empty falls back to Docker's default runtime, with a warning on
      # every create: a host that has not been provisioned yet still runs
      # reviews, which is better than a service that will not start.
      CUJO_SANDBOX_CONTAINER_RUNTIME: ${CUJO_SANDBOX_CONTAINER_RUNTIME:-}
      CUJO_SANDBOX_EGRESS_NETWORK: ${CUJO_SANDBOX_EGRESS_NETWORK:-bridge}
      CUJO_SANDBOX_MAX_LIFETIME_MS: ${CUJO_SANDBOX_MAX_LIFETIME_MS:-}
      # Only read when CUJO_SANDBOX_RUNTIME is `daytona`.
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
    volumes:
      # The whole reason the hardening above cannot apply. The daemon is the
      # host's; this service is a client of it.
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8082/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      # A cold build of the sandbox image is minutes of apt and pip. Failures
      # inside the start period do not count, so a first deploy waits for the
      # build instead of restarting the service in the middle of it; a warm
      # rebuild is layer-cached and passes in seconds.
      start_period: 20m
    restart: unless-stopped

  # The UI (apps/web), on the one public hostname; `cujo` is API-only and is
  # reached from here over the compose network. Browser calls go through this
  # service's /api proxy, which forwards `/public/*` and no credential — there
  # is none to forward (decision 57). No Cujo API route is published directly.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CUJO_API_URL: http://cujo:8080
      CUJO_WEB_ORIGIN: ${CUJO_WEB_ORIGIN:-https://cujo.spencerjireh.com}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      cujo:
        condition: service_healthy
    restart: unless-stopped

  # Internal MCP server the agent calls to post reviews. It is the only service
  # that holds the GitHub App private key besides cujo, so the same hardening
  # applies. Never routed by Traefik.
  github-mcp:
    build:
      context: .
      dockerfile: apps/github-mcp/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8081
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      # The board a review's evidence footer points at. Held here rather than
      # taken from the agent, so nothing the agent read in a pull request can
      # choose that host; unset means no review carries a footer (decision 36).
      CUJO_PUBLIC_BASE_URL: ${CUJO_PUBLIC_BASE_URL:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  harnessdata:
  cujodata:
