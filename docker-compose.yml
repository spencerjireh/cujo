# Cujo — stock TrueForge harness in hosted mode (Postgres + Redis, not SQLite).
#
# No ports are published here: the deploy runs behind a reverse proxy that
# terminates TLS and routes cujo-harness.spencerjireh.com to `server` (8790),
# cujo.spencerjireh.com and cujo-admin.spencerjireh.com to `web` (3000), and
# cujo-ingress.spencerjireh.com to `cujo` (8080). The two `web` hostnames are
# the public board and the Access-gated operator UI; the app tells them apart
# by the request's own Host (decision 34). For a local run with ports on your
# host, see the local stack section of AGENTS.md. Secrets come from the deploy
# environment, never this file.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8790
      HOST: 0.0.0.0
      # Hosted mode: use Postgres + Redis, not SQLite.
      STANDALONE: 'false'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Public origin for MCP OAuth callbacks and the (later) GitHub webhook.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # A review turn runs tests, probes, a smoke boot, and installs; the
      # server's defaults (10 minutes for both) cancel it mid-check. Keep in
      # step with CUJO_TURN_TIMEOUT_MS on the cujo service (30 minutes).
      SERVER_EXECUTION_TIMEOUT_SECONDS: ${SERVER_EXECUTION_TIMEOUT_SECONDS:-1800}
      TURN_SUBSCRIBE_TIMEOUT_MS: ${TURN_SUBSCRIBE_TIMEOUT_MS:-1860000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Above the app's default 30s graceful timeout so turn drain is not cut off.
    stop_grace_period: 35s
    restart: unless-stopped

  # The Cujo service: webhook receiver, run store, TrueForge event folder, the
  # JSON API, approve endpoint. Two hostnames and two planes from one process
  # (spec Contract 6): the signature-gated ingress host, and the UI host that
  # carries both the Access-gated API and the anonymous `/public` group.
  # Hardened: non-root image, read-only rootfs except the SQLite volume, no
  # extra capabilities.
  cujo:
    build:
      context: .
      dockerfile: apps/cujo/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      TRUEFORGE_BASE_URL: http://server:8790
      GITHUB_MCP_URL: http://github-mcp:8081/mcp
      CUJO_DB_PATH: /data/cujo.db
      CUJO_UI_HOST: ${CUJO_UI_HOST}
      # The name `web` addresses this service by on the compose network. Node's
      # fetch always sends the target's own authority as Host, so the operator
      # UI's proxy cannot present CUJO_UI_HOST; the API routes answer on this
      # name too, still behind the Access check.
      CUJO_INTERNAL_HOST: cujo
      CUJO_WEBHOOK_HOST: ${CUJO_WEBHOOK_HOST}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      CUJO_MODEL: ${CUJO_MODEL}
      CUJO_SNIFF_URL: ${CUJO_SNIFF_URL:-https://raw.githubusercontent.com/spencerjireh/cujo/main/sandbox/sniff.py}
      # Optional Discord notifications (spec Contract 7). Unset means the
      # service runs without them; the repo-to-channel map lives in the store.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # The application public key, which gates the /cujo command (Contract 8).
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      # The one server a repo that declares no `discord_guild` belongs to
      # (decision 40). One id, never a list: every other server is refused
      # exactly as before. Unset keeps Contract 8's original rule.
      CUJO_DEFAULT_DISCORD_GUILD: ${CUJO_DEFAULT_DISCORD_GUILD:-}
      # Where a Discord card sends someone who has to decide. Since decision 34
      # this is the ADMIN hostname: the board at CUJO_PUBLIC_BASE_URL is
      # read-only and has no buttons.
      CUJO_UI_BASE_URL: ${CUJO_UI_BASE_URL:-}
      # Where a card for a *public* run points instead, so a repo's channel is
      # not answered with an Access login page. Empty falls back to the above.
      CUJO_PUBLIC_BASE_URL: ${CUJO_PUBLIC_BASE_URL:-}
      # Concurrent anonymous run streams this process will hold, and how often
      # it re-asks GitHub whether each repo with a run is still public.
      CUJO_PUBLIC_STREAM_LIMIT: ${CUJO_PUBLIC_STREAM_LIMIT:-200}
      CUJO_VISIBILITY_RECHECK_MS: ${CUJO_VISIBILITY_RECHECK_MS:-900000}
      # Does Cujo react on the pull requests it reviews (decision 38)? Only an
      # explicit 0 turns it off.
      CUJO_PR_REACTIONS: ${CUJO_PR_REACTIONS:-1}
      # One turn, stream retries included; the Daytona idle stop is derived from it.
      CUJO_TURN_TIMEOUT_MS: ${CUJO_TURN_TIMEOUT_MS:-1800000}
      # Optional one-time bootstrap of the harness (model + sandbox providers).
      # Leave unset to configure them in the operator console instead.
      MODEL_PROVIDER_NAME: ${MODEL_PROVIDER_NAME:-}
      MODEL_PROVIDER_BASE_URL: ${MODEL_PROVIDER_BASE_URL:-}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      MODEL_PROVIDER_MODELS: ${MODEL_PROVIDER_MODELS:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
    volumes:
      - cujodata:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
    restart: unless-stopped

  # The UI (apps/web), on both public hostnames; `cujo` is API-only and is
  # reached from here over the compose network. Browser calls go through this
  # service's /api proxy: on the operator hostname it forwards the Cloudflare
  # Access assertion, and on the public one it forwards no assertion and only
  # `/public/*` paths (decision 34). No Cujo API route is published directly.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      CUJO_API_URL: http://cujo:8080
      # Public only on an exact match of this name; every other Host — an
      # unknown one, or this variable left unset — is treated as the operator
      # plane, which then needs an Access assertion and is refused without one.
      CUJO_PUBLIC_HOST: ${CUJO_PUBLIC_HOST:-}
      # Where the public board sends someone who has to approve something.
      CUJO_ADMIN_BASE_URL: ${CUJO_ADMIN_BASE_URL:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      cujo:
        condition: service_healthy
    restart: unless-stopped

  # Internal MCP server the agent calls to post reviews. It is the only service
  # that holds the GitHub App private key besides cujo, so the same hardening
  # applies. Never routed by Traefik.
  github-mcp:
    build:
      context: .
      dockerfile: apps/github-mcp/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8081
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      # The board a review's evidence footer points at. Held here rather than
      # taken from the agent, so nothing the agent read in a pull request can
      # choose that host; unset means no review carries a footer (decision 36).
      CUJO_PUBLIC_BASE_URL: ${CUJO_PUBLIC_BASE_URL:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  cujodata:
