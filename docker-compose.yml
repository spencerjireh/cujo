# Cujo — stock TrueForge harness in hosted mode (Postgres + Redis, not SQLite).
#
# No ports are published here: the deploy runs behind a reverse proxy that
# terminates TLS and routes the public origin to the `server` service on port
# 8790. For a local run with ports on your host, use docker-compose.local.yml
# (`make up-local`). Secrets come from the deploy environment, never this file.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8790
      HOST: 0.0.0.0
      # Hosted mode: use Postgres + Redis, not SQLite.
      STANDALONE: 'false'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Public origin for MCP OAuth callbacks and the (later) GitHub webhook.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Above the app's default 30s graceful timeout so turn drain is not cut off.
    stop_grace_period: 35s
    restart: unless-stopped

  # Public webhook receiver (skeleton: /healthz only). Routed by Coolify/Traefik,
  # so no published ports here. Hardened: non-root image, read-only rootfs, no
  # extra capabilities.
  ingress:
    build:
      context: .
      dockerfile: apps/ingress/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Internal MCP server the agent calls to post reviews (skeleton: /healthz only).
  # Holds the GitHub App private key in the next milestone, so the same hardening
  # applies.
  github-mcp:
    build:
      context: .
      dockerfile: apps/github-mcp/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8081
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
