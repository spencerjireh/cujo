# Cujo — stock TrueForge harness in hosted mode (Postgres + Redis, not SQLite).
#
# No ports are published here: the deploy runs behind a reverse proxy that
# terminates TLS and routes cujo-harness.spencerjireh.com to `server` (8790)
# and cujo.spencerjireh.com plus cujo-ingress.spencerjireh.com to `cujo`
# (8080). For a local run with ports on your host, use docker-compose.local.yml
# (`make up-local`). Secrets come from the deploy environment, never this file.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8790
      HOST: 0.0.0.0
      # Hosted mode: use Postgres + Redis, not SQLite.
      STANDALONE: 'false'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Public origin for MCP OAuth callbacks and the (later) GitHub webhook.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Above the app's default 30s graceful timeout so turn drain is not cut off.
    stop_grace_period: 35s
    restart: unless-stopped

  # The Cujo service: webhook receiver, run store, TrueForge event folder, UI and
  # API, approve endpoint. Serves two hostnames from one process (spec Contract
  # 6); Coolify/Traefik routes both here, so no published ports. Hardened:
  # non-root image, read-only rootfs except the SQLite volume, no extra
  # capabilities.
  cujo:
    build:
      context: .
      dockerfile: apps/cujo/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      TRUEFORGE_BASE_URL: http://server:8790
      GITHUB_MCP_URL: http://github-mcp:8081/mcp
      CUJO_DB_PATH: /data/cujo.db
      CUJO_UI_HOST: ${CUJO_UI_HOST}
      CUJO_WEBHOOK_HOST: ${CUJO_WEBHOOK_HOST}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      CUJO_MODEL: ${CUJO_MODEL}
      CUJO_SNIFF_URL: ${CUJO_SNIFF_URL:-https://raw.githubusercontent.com/spencerjireh/cujo/main/sniff.py}
      # One turn, stream retries included; the Daytona idle stop is derived from it.
      CUJO_TURN_TIMEOUT_MS: ${CUJO_TURN_TIMEOUT_MS:-1800000}
      # Optional one-time bootstrap of the harness (model + sandbox providers).
      # Leave unset to configure them in the operator console instead.
      MODEL_PROVIDER_NAME: ${MODEL_PROVIDER_NAME:-}
      MODEL_PROVIDER_BASE_URL: ${MODEL_PROVIDER_BASE_URL:-}
      MODEL_PROVIDER_API_KEY: ${MODEL_PROVIDER_API_KEY:-}
      MODEL_PROVIDER_MODELS: ${MODEL_PROVIDER_MODELS:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
    volumes:
      - cujodata:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
    restart: unless-stopped

  # Internal MCP server the agent calls to post reviews. It is the only service
  # that holds the GitHub App private key besides cujo, so the same hardening
  # applies. Never routed by Traefik.
  github-mcp:
    build:
      context: .
      dockerfile: apps/github-mcp/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8081
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  cujodata:
