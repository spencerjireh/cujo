[project]
name = "cujo-sniff"
version = "0.0.0"
description = "In-sandbox sensors and dependency detonation for Cujo."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv]
# sandbox/ is fetched into the sandbox and imported from sys.path[0]; nothing
# installs it, here or there.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Where first-party code lives, so isort classifies `import sniff` as ours.
# Without it the import is read as third-party and `ruff check` fails I001 --
# and, worse, `ruff check --fix` "resolves" it by merging the import blocks,
# which goes green while making the misclassification permanent.
src = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["sandbox/tests"]
# Nothing is installed, so the directory is the path -- which is also the
# arrangement inside the sandbox, where `sniff.py` and `cujo_sniff/` are
# siblings and `sys.path[0]` is what finds the package.
pythonpath = ["sandbox"]
addopts = "--strict-markers"
markers = [
  "harness: needs a real state directory, subprocesses, or the sensor daemons",
  "slow: builds a virtualenv or installs a package",
]
