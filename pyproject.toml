[project]
name = "cujo-sniff"
version = "0.0.0"
description = "In-sandbox sensors and dependency detonation for Cujo."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
]

[tool.uv]
# sandbox/ is fetched into the sandbox and imported from sys.path[0]; nothing
# installs it, here or there.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Where first-party code lives, so isort classifies `import sniff` as ours.
# Without it the import is read as third-party and `ruff check` fails I001 --
# and, worse, `ruff check --fix` "resolves" it by merging the import blocks,
# which goes green while making the misclassification permanent.
src = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["sandbox/tests"]
# Nothing is installed, so the directory is the path -- which is also the
# arrangement inside the sandbox, where `sniff.py` and `cujo_sniff/` are
# siblings and `sys.path[0]` is what finds the package.
pythonpath = ["sandbox"]
# `-n auto` because nearly every test here spawns `python3 -m cujo_sniff` and
# waits on it, so the suite is bound by process startup and IO rather than by
# CPU. Every test already owns its directories -- the `cli` fixture roots HOME,
# CUJO_DIR and CUJO_ENVS_DIR in `tmp_path`, and the proxy binds port 0 -- so
# there is nothing for workers to collide over. Add `-n0` to run in one process
# when debugging a single test; the workers are pure overhead for one test, and
# they swallow the output a debugger wants.
addopts = "--strict-markers -n auto"
markers = [
  "harness: needs a real state directory, subprocesses, or the sensor daemons",
  "slow: builds a virtualenv or installs a package",
]
