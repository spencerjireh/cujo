# Overlay for the harness contract tests (`make test-int`). Runs the TrueForge
# server, its stores, and github-mcp with fixed throwaway credentials, and
# publishes only the server on loopback:8790. github-mcp gets a dummy App key:
# the tests exercise tool listing and the approval gate, and the GitHub call
# behind the tool fails in the sandboxed way the tests expect. The cujo
# service is not started. Never used by the deploy.
#
#   docker compose -p cujo-int -f docker-compose.yml -f docker-compose.test.yml up -d server github-mcp

services:
  github-mcp:
    environment:
      GITHUB_APP_ID: '1'
      GITHUB_APP_PRIVATE_KEY: not-a-real-key

  postgres:
    environment:
      POSTGRES_USER: cujo
      POSTGRES_PASSWORD: cujo-int-test
      POSTGRES_DB: cujo

  server:
    environment:
      POSTGRES_USER: cujo
      POSTGRES_PASSWORD: cujo-int-test
      POSTGRES_DB: cujo
      PUBLIC_BASE_URL: http://localhost:8790
    # The stub model provider runs in the test process on the host; on Linux
    # engines host.docker.internal needs this mapping (Docker Desktop and
    # OrbStack provide it on their own).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:8790:8790'
