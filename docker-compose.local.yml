# Local overlay for docker-compose.yml. Makes the stock hosted-mode stack
# reachable from the host, which the base file deliberately does not do
# (in production a reverse proxy terminates TLS and routes to the services on the internal
# network, so the base file publishes no ports and points PUBLIC_BASE_URL at
# the production domain).
#
# This file changes nothing about how the stack deploys: it is never referenced
# by the base compose file and is only applied when you pass it explicitly.
#
# Published ports bind to 127.0.0.1 (loopback) only, so the services — including
# unauthenticated Redis and Postgres — are reachable from this machine but not
# from the local network. On Linux this isolation relies on Docker Engine
# >= 28.0; older engines can still route loopback-published ports from the LAN.
# Docker Desktop (macOS/Windows) runs the engine in a VM and is unaffected.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# or just `make up-local`. See .env.example for the POSTGRES_* values; a local
# PUBLIC_BASE_URL is set here so you do not have to edit .env for local runs.

services:
  server:
    # Overrides the prod default (https://cujo.spencerjireh.com) so MCP OAuth
    # callbacks and the webhook URL resolve to your machine.
    environment:
      PUBLIC_BASE_URL: http://localhost:8790
    ports:
      - '127.0.0.1:8790:8790' # TrueForge operator console + API

  cujo:
    environment:
      # Host dispatch (spec Contract 6). The read plane answers on the compose
      # service name and nothing else, which is what every production request
      # carries too, so curl it with -H 'Host: cujo'. Everything outside
      # /public is 404 there; there is no credential to present (decision 54).
      CUJO_INTERNAL_HOST: cujo
      CUJO_WEBHOOK_HOST: cujo-ingress.localhost
      # Only here, never in the base file: the deploy runs at the default
      # `info`, and the lines this reaches down for — the public stream's
      # open and close, an ignored webhook — are debug precisely because
      # they are not worth their volume in production (decision 37).
      CUJO_LOG_LEVEL: ${CUJO_LOG_LEVEL:-info}
      # Run links in a Discord card. A public run points at the board; a
      # private one has no page, so its card carries no link (decision 54).
      CUJO_PUBLIC_BASE_URL: ${CUJO_PUBLIC_BASE_URL:-http://cujo.localhost:3000}
      # The dev App posts as a different bot; this makes the idempotency
      # check and stale-review dismissal match the right login.
      CUJO_BOT_LOGIN: ${CUJO_BOT_LOGIN:-cujo-guard[bot]}
    ports:
      - '127.0.0.1:8080:8080' # Cujo API, and the webhook receiver

  # One container, one plane. http://localhost:3000 and
  # http://cujo.localhost:3000 are the same anonymous board — there is nothing
  # else to be since decision 54, so no Host tells them apart. Most systems
  # resolve any *.localhost name to loopback; add them to /etc/hosts if yours
  # does not.
  web:
    environment:
      CUJO_API_URL: http://cujo:8080
    ports:
      - '127.0.0.1:3000:3000' # The UI — open http://localhost:3000

  github-mcp:
    environment:
      # Same board the cujo service links to, so a locally posted review's
      # footer resolves against the local UI.
      CUJO_PUBLIC_BASE_URL: ${CUJO_PUBLIC_BASE_URL:-http://cujo.localhost:3000}
    ports:
      - '127.0.0.1:8081:8081' # internal MCP server (review posting)

  postgres:
    ports:
      - '127.0.0.1:5432:5432' # inspect with: psql -h localhost -U cujo cujo

  redis:
    ports:
      - '127.0.0.1:6379:6379' # inspect with: redis-cli -h localhost ping
