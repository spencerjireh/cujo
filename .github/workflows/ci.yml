name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch per repository. Two runs otherwise finish in full when only
# the later one describes the code now on the branch -- from a second push, or
# from somebody pressing "Run workflow" on a branch a `pull_request` run is
# already covering.
#
# The branch half is the branch and not `pull_request.number`, because a
# `workflow_dispatch` run has no pull request and would land in its own group,
# which is the pairing this is here to collapse. The repository half is there
# because a branch name alone is not an identity: two forks can both offer
# `patch-1`, and with `cancel-in-progress` one fork's run would cancel the
# other's and leave that pull request with no completed CI. `github.repository`
# is the fallback so a `workflow_dispatch` run still shares the group with the
# `pull_request` run for the same branch of this repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    # `pnpm build` now runs `next build`; without this it stalls on the
    # first-run telemetry prompt in a fresh runner.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cujo, github-mcp, harness, ocr-sidecar, sandbox-mcp, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f apps/${{ matrix.service }}/Dockerfile -t cujo-${{ matrix.service }}:ci .
      # An image that builds is not an image that boots. A bundled CommonJS
      # dependency threw on its first line under ESM and the container exited
      # before any config was read, which took the deploy and the site with
      # it. Every service refuses to start without its configuration, so a
      # boot with none must reach that refusal and not a module error.
      - name: the image boots far enough to refuse its configuration
        run: |
          timeout 60 docker run --rm cujo-${{ matrix.service }}:ci > boot.log 2>&1 || true
          cat boot.log
          if grep -qiE "Dynamic require of|Cannot find module|Cannot find package|ERR_MODULE_NOT_FOUND" boot.log; then
            echo "::error::${{ matrix.service }}: the bundle does not load"
            exit 1
          fi

  # The two images that are not a workspace app: the sandbox a review runs in,
  # and the gateway that filters its egress (decisions 116, 117).
  sandbox-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f sandbox/Dockerfile -t cujo-sandbox:ci sandbox
      - run: docker build -t cujo-sandbox-gateway:ci apps/sandbox-mcp/gateway

  # Harness contract tests: the real harness, github-mcp and sandbox-mcp from the
  # compose file, a stub model provider in the test process.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make test-int-up
      - run: make test-int
      - if: always()
        run: |
          docker compose -p cujo-int -f docker-compose.yml -f docker-compose.test.yml logs harness github-mcp | tail -200
          make test-int-down
